<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#9dc4e8" />
<meta name="description" content="Mobile WebGL third-person shooter character test." />
<title>Tactical Arena — TPS Character Test</title>

<style>
  /* ------------------------------------------------------------------ */
  /*  Base / reset                                                       */
  /* ------------------------------------------------------------------ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0e13;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  #app canvas {
    display: block;
    touch-action: none;
  }

  /* ------------------------------------------------------------------ */
  /*  HUD shell                                                          */
  /* ------------------------------------------------------------------ */
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* ------------------------------------------------------------------ */
  /*  Loading overlay                                                    */
  /* ------------------------------------------------------------------ */
  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 32%, #1b2735 0%, #090a0f 100%);
    transition: opacity 0.65s ease, visibility 0.65s ease;
  }

  .loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px;
    text-align: center;
  }

  .spinner {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 26px;
  }

  .spinner span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #f5a623;
    animation: dotBounce 1.2s infinite ease-in-out;
  }

  .spinner span:nth-child(2) {
    background: #ffd166;
    animation-delay: 0.15s;
  }

  .spinner span:nth-child(3) {
    background: #8fd694;
    animation-delay: 0.3s;
  }

  @keyframes dotBounce {
    0%, 80%, 100% {
      transform: translateY(0);
      opacity: 0.45;
    }
    40% {
      transform: translateY(-14px);
      opacity: 1;
    }
  }

  .loader-title {
    font-size: clamp(18px, 5.2vmin, 28px);
    font-weight: 800;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #ffd166;
    text-shadow: 0 0 24px rgba(245, 166, 35, 0.45);
    margin-bottom: 12px;
  }

  .loader-text {
    font-size: clamp(12px, 3.4vmin, 15px);
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.78);
  }

  .loader-text.error {
    color: #ff7b7b;
    max-width: 78vw;
    line-height: 1.5;
  }

  .progress {
    width: min(280px, 64vw);
    height: 5px;
    margin-top: 20px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }

  .progress-bar {
    width: 0%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #f5a623, #ffd166);
    transition: width 0.25s ease;
  }

  /* ------------------------------------------------------------------ */
  /*  Camera look zone (right half)                                      */
  /* ------------------------------------------------------------------ */
  .look-zone {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 50%;
    z-index: 1;
    pointer-events: auto;
    touch-action: none;
  }

  /* ------------------------------------------------------------------ */
  /*  Virtual joystick                                                   */
  /* ------------------------------------------------------------------ */
  :root {
    --joy-size: clamp(112px, 27vmin, 190px);
  }

  .joystick {
    position: absolute;
    left: calc(env(safe-area-inset-left, 0px) + 4.5vmin);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 5.5vmin);
    width: var(--joy-size);
    height: var(--joy-size);
    border-radius: 50%;
    z-index: 5;
    pointer-events: auto;
    touch-action: none;
    background: radial-gradient(
      circle at 50% 50%,
      rgba(255, 255, 255, 0.11) 0%,
      rgba(255, 255, 255, 0.045) 58%,
      rgba(255, 255, 255, 0.0) 72%
    );
    border: 2px solid rgba(255, 255, 255, 0.26);
    box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.4),
      0 0 20px rgba(0, 0, 0, 0.35);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .joystick.active {
    border-color: rgba(255, 209, 102, 0.85);
    box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.4),
      0 0 26px rgba(245, 166, 35, 0.35);
  }

  .joystick .crosshair {
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.16);
    pointer-events: none;
  }

  .joystick .knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 42%;
    height: 42%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 28%, #ffffff, #d8dde3 55%, #97a2ae);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5),
      inset 0 -3px 7px rgba(0, 0, 0, 0.18);
    transition: transform 0.13s ease-out;
    will-change: transform;
    pointer-events: none;
  }

  .joystick.active .knob {
    transition: none;
  }

  /* ------------------------------------------------------------------ */
  /*  Action buttons                                                     */
  /* ------------------------------------------------------------------ */
  .actions {
    position: absolute;
    right: calc(env(safe-area-inset-right, 0px) + 5vmin);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 5.5vmin);
    display: flex;
    align-items: flex-end;
    gap: 3.2vmin;
    z-index: 6;
    pointer-events: none;
  }

  .action-btn {
    pointer-events: auto;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(62px, 14vmin, 92px);
    height: clamp(62px, 14vmin, 92px);
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    background: radial-gradient(
      circle at 50% 35%,
      rgba(255, 255, 255, 0.24),
      rgba(255, 255, 255, 0.07) 70%
    );
    color: #ffffff;
    font-size: clamp(9px, 2.1vmin, 12px);
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    transition: transform 0.09s ease, background 0.15s ease,
      border-color 0.15s ease;
  }

  .action-btn.pressed,
  .action-btn:active {
    transform: scale(0.92);
    background: radial-gradient(
      circle at 50% 35%,
      rgba(255, 209, 102, 0.6),
      rgba(245, 166, 35, 0.28) 70%
    );
    border-color: rgba(255, 209, 102, 0.95);
  }

  .action-btn.crouch {
    width: clamp(54px, 12vmin, 78px);
    height: clamp(54px, 12vmin, 78px);
    border-color: rgba(143, 214, 148, 0.55);
  }

  .action-btn.crouch.active {
    background: radial-gradient(
      circle at 50% 35%,
      rgba(143, 214, 148, 0.65),
      rgba(80, 170, 95, 0.3) 70%
    );
    border-color: rgba(143, 214, 148, 0.95);
  }

  /* ------------------------------------------------------------------ */
  /*  Status panel                                                       */
  /* ------------------------------------------------------------------ */
  .stats {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 2.6vmin);
    left: calc(env(safe-area-inset-left, 0px) + 3vmin);
    z-index: 7;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(6, 12, 20, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: clamp(9px, 1.9vmin, 12px);
    line-height: 1.65;
    letter-spacing: 0.05em;
    color: rgba(255, 255, 255, 0.82);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .stats b {
    color: #ffd166;
    font-weight: 700;
  }

  .sprint-badge {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 2.6vmin);
    right: calc(env(safe-area-inset-right, 0px) + 3vmin);
    z-index: 7;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 209, 102, 0.4);
    background: rgba(6, 12, 20, 0.42);
    color: rgba(255, 255, 255, 0.35);
    font-size: clamp(9px, 1.9vmin, 12px);
    font-weight: 800;
    letter-spacing: 0.22em;
    transition: color 0.2s ease, background 0.2s ease,
      border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .sprint-badge.on {
    color: #0a0e13;
    background: #ffd166;
    border-color: #ffd166;
    box-shadow: 0 0 20px rgba(255, 209, 102, 0.6);
  }

  /* ------------------------------------------------------------------ */
  /*  Rotate-device hint (portrait only)                                 */
  /* ------------------------------------------------------------------ */
  .rotate-hint {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #090a0f;
    color: #ffd166;
    text-align: center;
    padding: 24px;
  }

  .rotate-hint .phone {
    width: 62px;
    height: 104px;
    border: 3px solid #ffd166;
    border-radius: 12px;
    animation: rotatePhone 2s infinite ease-in-out;
  }

  @keyframes rotatePhone {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(90deg); }
  }

  .rotate-hint p {
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  @media (orientation: portrait) {
    .rotate-hint {
      display: flex;
    }
  }
</style>
</head>

<body>

  <!-- ================= Application / WebGL canvas ================= -->
  <div id="app"></div>

  <!-- ============================ HUD ============================= -->
  <div class="hud">
    <!-- Right half: TPS camera drag zone -->
    <div id="lookZone" class="look-zone"></div>

    <!-- Bottom-left: virtual joystick -->
    <div id="joystick" class="joystick">
      <div class="crosshair"></div>
      <div id="joystickKnob" class="knob"></div>
    </div>

    <!-- Bottom-right: action buttons -->
    <div class="actions">
      <button id="crouchBtn" class="action-btn crouch" type="button">Crouch</button>
      <button id="jumpBtn" class="action-btn" type="button">Jump</button>
    </div>

    <!-- Status -->
    <div id="stats" class="stats">
      FPS <b id="statFps">--</b> · SPD <b id="statSpeed">0.0</b><br />
      STATE <b id="statState">IDLE</b>
    </div>

    <div id="sprintBadge" class="sprint-badge">Sprint</div>
  </div>

  <!-- ====================== Loading overlay ======================= -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loader-content">
      <div class="spinner"><span></span><span></span><span></span></div>
      <h1 class="loader-title">Tactical Arena</h1>
      <p class="loader-text" id="loaderText">Loading 3D Character…</p>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>

  <!-- ==================== Rotate device hint ====================== -->
  <div class="rotate-hint">
    <div class="phone"></div>
    <p>Rotate your device</p>
  </div>

  <!-- ======================= Import map =========================== -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- ==================== Bootstrap / safety ====================== -->
  <script>
    // Surface unexpected module errors inside the loading overlay.
    window.__fatal = function (message) {
      var overlay = document.getElementById('loadingOverlay');
      var text = document.getElementById('loaderText');
      var bar = document.getElementById('progressBar');
      if (overlay) overlay.classList.remove('hidden');
      if (bar) bar.style.width = '100%';
      if (text) {
        text.classList.add('error');
        text.textContent = 'Error: ' + message;
      }
    };

    window.addEventListener('error', function (event) {
      if (event && event.message) window.__fatal(event.message);
    });

    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      window.__fatal(reason && reason.message ? reason.message : String(reason));
    });

    // Kill iOS pinch-zoom / double-tap zoom / rubber-band scrolling.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  </script>

  <!-- ======================== Game module ========================= -->
  <script type="module">
    import * as THREE from 'three';
    import { Player } from './js/player.js';

    /* ================================================================== */
    /*  DOM references                                                    */
    /* ================================================================== */
    const appEl         = document.getElementById('app');
    const overlayEl     = document.getElementById('loadingOverlay');
    const loaderTextEl  = document.getElementById('loaderText');
    const progressBarEl = document.getElementById('progressBar');
    const joystickEl    = document.getElementById('joystick');
    const knobEl        = document.getElementById('joystickKnob');
    const lookZoneEl    = document.getElementById('lookZone');
    const jumpBtn       = document.getElementById('jumpBtn');
    const crouchBtn     = document.getElementById('crouchBtn');
    const statFpsEl     = document.getElementById('statFps');
    const statSpeedEl   = document.getElementById('statSpeed');
    const statStateEl   = document.getElementById('statState');
    const sprintBadgeEl = document.getElementById('sprintBadge');

    /* ================================================================== */
    /*  Tunables                                                          */
    /* ================================================================== */
    const SKY_COLOR        = 0x9dc4e8;
    const GROUND_COLOR     = 0x53663f;
    const GRID_COLOR_MAIN  = 0xbfe3a8;
    const GRID_COLOR_SUB   = 0x7d9a6a;

    const CAM_DISTANCE       = 6.0;
    const CAM_TARGET_HEIGHT  = 1.55;
    const CAM_SMOOTHING      = 12.0;
    const CAM_MIN_PITCH      = -0.42;
    const CAM_MAX_PITCH      = 1.22;
    const CAM_START_PITCH    = 0.34;
    const CAM_SENSITIVITY    = 0.0045;

    const GRAVITY        = -24.0;
    const JUMP_SPEED     = 8.0;

    const SPRINT_THRESHOLD = 0.9;

    const CROUCH_SCALE        = 0.62;
    const CROUCH_LAMBDA       = 14.0;
    const CROUCH_WALK_SPEED   = 1.15;
    const CROUCH_RUN_SPEED    = 1.85;

    /* ================================================================== */
    /*  Module-level state                                                */
    /* ================================================================== */
    let renderer = null;
    let scene    = null;
    let camera   = null;
    let player   = null;
    let sun      = null;

    const sunOffset = new THREE.Vector3(26, 42, 20);

    /* Camera orbit state */
    let camYaw   = Math.PI;
    let camPitch = CAM_START_PITCH;

    const cameraTarget   = new THREE.Vector3();
    const desiredCamPos  = new THREE.Vector3();
    const smoothCamPos   = new THREE.Vector3();
    const playerPos      = new THREE.Vector3();

    /* Movement / input state */
    const joystickVector = { x: 0, y: 0 };
    let isSprinting = false;

    /* Vertical motion (jump) state */
    let jumpHeight   = 0;
    let jumpVelocity = 0;
    let isAirborne   = false;

    /* Crouch state */
    let isCrouched   = false;
    let modelScaleY  = 1;

    /* Cached base speeds (read from the Player config after init) */
    let baseWalkSpeed = 2.4;
    let baseRunSpeed  = 6.8;

    /* Frame timing / stats */
    const clock = new THREE.Clock();
    let statTimer = 0;
    let frameCounter = 0;
    let measuredFps = 0;

    /* ================================================================== */
    /*  Loading overlay helpers                                           */
    /* ================================================================== */
    let fakeProgress = 0;
    let progressTimer = null;

    function startFakeProgress() {
      progressTimer = window.setInterval(() => {
        fakeProgress = Math.min(fakeProgress + Math.random() * 9 + 2, 90);
        progressBarEl.style.width = fakeProgress.toFixed(1) + '%';
      }, 180);
    }

    function finishLoading() {
      if (progressTimer) {
        window.clearInterval(progressTimer);
        progressTimer = null;
      }
      progressBarEl.style.width = '100%';
      window.setTimeout(() => {
        overlayEl.classList.add('hidden');
      }, 260);
    }

    function failLoading(message) {
      if (progressTimer) {
        window.clearInterval(progressTimer);
        progressTimer = null;
      }
      progressBarEl.style.width = '100%';
      loaderTextEl.classList.add('error');
      loaderTextEl.textContent = message;
      overlayEl.classList.remove('hidden');
    }

    /* ================================================================== */
    /*  Renderer / scene / lighting                                       */
    /* ================================================================== */
    function createRenderer() {
      const r = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        stencil: false,
        powerPreference: 'high-performance',
      });

      r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      r.setSize(window.innerWidth, window.innerHeight, true);

      r.shadowMap.enabled = true;
      r.shadowMap.type = THREE.PCFSoftShadowMap;

      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.toneMappingExposure = 1.12;

      r.domElement.style.display = 'block';
      r.domElement.style.touchAction = 'none';

      appEl.appendChild(r.domElement);
      return r;
    }

    function createScene() {
      const s = new THREE.Scene();
      s.background = new THREE.Color(SKY_COLOR);
      s.fog = new THREE.Fog(SKY_COLOR, 55, 230);
      return s;
    }

    function createLighting(targetScene) {
      // --- Ambient fill (prevents pitch-black shadow interiors) ---------
      const ambient = new THREE.AmbientLight(0xffffff, 0.55);
      targetScene.add(ambient);

      // --- Hemisphere bounce (sky above / ground below) -----------------
      const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x53663f, 0.55);
      hemi.position.set(0, 50, 0);
      targetScene.add(hemi);

      // --- Sun (dynamic shadow-casting directional light) ---------------
      sun = new THREE.DirectionalLight(0xfff4e2, 2.15);
      sun.position.copy(sunOffset);
      sun.castShadow = true;

      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 140;
      sun.shadow.camera.left = -26;
      sun.shadow.camera.right = 26;
      sun.shadow.camera.top = 26;
      sun.shadow.camera.bottom = -26;
      sun.shadow.bias = -0.0006;
      sun.shadow.normalBias = 0.022;
      sun.shadow.radius = 2.2;

      targetScene.add(sun);
      targetScene.add(sun.target);

      return { ambient, hemi, sun };
    }

    function createGround(targetScene) {
      // --- Solid battlefield floor (receives shadows) --------------------
      const groundGeo = new THREE.PlaneGeometry(600, 600, 1, 1);
      const groundMat = new THREE.MeshStandardMaterial({
        color: GROUND_COLOR,
        roughness: 0.97,
        metalness: 0.0,
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      ground.name = 'BattlefieldFloor';
      targetScene.add(ground);

      // --- High-resolution tactical grid overlay -------------------------
      const grid = new THREE.GridHelper(400, 200, GRID_COLOR_MAIN, GRID_COLOR_SUB);
      grid.position.y = 0.02;
      grid.material.transparent = true;
      grid.material.opacity = 0.35;
      grid.material.depthWrite = false;
      grid.name = 'BattlefieldGrid';
      targetScene.add(grid);

      return { ground, grid };
    }

    /* ================================================================== */
    /*  Virtual joystick                                                  */
    /* ================================================================== */
    const JOY_DEADZONE = 0.06;

    let joyPointerId = null;
    let joyCenterX = 0;
    let joyCenterY = 0;
    let joyTravel = 1;

    function joystickReset() {
      joyPointerId = null;
      joystickVector.x = 0;
      joystickVector.y = 0;
      joystickEl.classList.remove('active');
      knobEl.style.transform = 'translate(-50%, -50%)';
    }

    function joystickApply(clientX, clientY) {
      let dx = clientX - joyCenterX;
      let dy = clientY - joyCenterY;

      const distance = Math.hypot(dx, dy);
      if (distance > joyTravel && distance > 1e-6) {
        const scale = joyTravel / distance;
        dx *= scale;
        dy *= scale;
      }

      knobEl.style.transform =
        'translate(-50%, -50%) translate(' + dx.toFixed(2) + 'px, ' + dy.toFixed(2) + 'px)';

      // Normalise to [-1, 1]; screen-up maps to forward (+y).
      let vx = dx / joyTravel;
      let vy = dy / joyTravel;

      // Radial dead-zone.
      const mag = Math.hypot(vx, vy);
      if (mag < JOY_DEADZONE) {
        joystickVector.x = 0;
        joystickVector.y = 0;
        return;
      }

      joystickVector.x = vx;
      joystickVector.y = -vy;

      // Clamp total magnitude to 1.
      const outMag = Math.hypot(joystickVector.x, joystickVector.y);
      if (outMag > 1) {
        joystickVector.x /= outMag;
        joystickVector.y /= outMag;
      }
    }

    function bindJoystick() {
      joystickEl.addEventListener('pointerdown', (event) => {
        if (joyPointerId !== null) return;
        event.preventDefault();

        joyPointerId = event.pointerId;
        try { joystickEl.setPointerCapture(event.pointerId); } catch (e) { /* noop */ }

        const rect = joystickEl.getBoundingClientRect();
        joyCenterX = rect.left + rect.width * 0.5;
        joyCenterY = rect.top + rect.height * 0.5;
        joyTravel = rect.width * 0.34; // knob travel radius

        joystickEl.classList.add('active');
        joystickApply(event.clientX, event.clientY);
      }, { passive: false });

      joystickEl.addEventListener('pointermove', (event) => {
        if (event.pointerId !== joyPointerId) return;
        event.preventDefault();
        joystickApply(event.clientX, event.clientY);
      }, { passive: false });

      const release = (event) => {
        if (event.pointerId !== joyPointerId) return;
        joystickReset();
      };

      joystickEl.addEventListener('pointerup', release);
      joystickEl.addEventListener('pointercancel', release);
      joystickEl.addEventListener('lostpointercapture', release);
    }

    /* ================================================================== */
    /*  TPS camera drag zone (right half)                                 */
    /* ================================================================== */
    let lookPointerId = null;
    let lookLastX = 0;
    let lookLastY = 0;

    function bindLookZone() {
      lookZoneEl.addEventListener('pointerdown', (event) => {
        if (lookPointerId !== null) return;
        event.preventDefault();

        lookPointerId = event.pointerId;
        try { lookZoneEl.setPointerCapture(event.pointerId); } catch (e) { /* noop */ }

        lookLastX = event.clientX;
        lookLastY = event.clientY;
      }, { passive: false });

      lookZoneEl.addEventListener('pointermove', (event) => {
        if (event.pointerId !== lookPointerId) return;
        event.preventDefault();

        const dx = event.clientX - lookLastX;
        const dy = event.clientY - lookLastY;
        lookLastX = event.clientX;
        lookLastY = event.clientY;

        // Swipe right -> look right (camera orbits clockwise).
        camYaw -= dx * CAM_SENSITIVITY;
        // Swipe up -> look up (camera drops, pitch decreases).
        camPitch += dy * CAM_SENSITIVITY;
        camPitch = THREE.MathUtils.clamp(camPitch, CAM_MIN_PITCH, CAM_MAX_PITCH);

        // Keep yaw in a sane range.
        if (camYaw > Math.PI * 4 || camYaw < -Math.PI * 4) {
          camYaw = camYaw % (Math.PI * 2);
        }
      }, { passive: false });

      const release = (event) => {
        if (event.pointerId !== lookPointerId) return;
        lookPointerId = null;
      };

      lookZoneEl.addEventListener('pointerup', release);
      lookZoneEl.addEventListener('pointercancel', release);
      lookZoneEl.addEventListener('lostpointercapture', release);
    }

    /* ================================================================== */
    /*  Action buttons                                                    */
    /* ================================================================== */
    function bindActionButton(element, onPress) {
      element.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        element.classList.add('pressed');
        try { element.setPointerCapture(event.pointerId); } catch (e) { /* noop */ }
        onPress();
      }, { passive: false });

      const release = (event) => {
        element.classList.remove('pressed');
        if (event && event.pointerId !== undefined) {
          try { element.releasePointerCapture(event.pointerId); } catch (e) { /* noop */ }
        }
      };

      element.addEventListener('pointerup', release);
      element.addEventListener('pointercancel', release);
      element.addEventListener('pointerleave', release);
    }

    function triggerJump() {
      if (isAirborne || !player || !player.ready) return;
      isAirborne = true;
      jumpVelocity = JUMP_SPEED;
    }

    function toggleCrouch() {
      isCrouched = !isCrouched;
      crouchBtn.classList.toggle('active', isCrouched);

      if (player) {
        player.config.walkSpeed = isCrouched ? CROUCH_WALK_SPEED : baseWalkSpeed;
        player.config.runSpeed  = isCrouched ? CROUCH_RUN_SPEED  : baseRunSpeed;
      }
    }

    function bindActions() {
      bindActionButton(jumpBtn, triggerJump);
      bindActionButton(crouchBtn, toggleCrouch);
    }

    /* ================================================================== */
    /*  Resize handling                                                   */
    /* ================================================================== */
    function handleResize() {
      if (!renderer || !camera) return;

      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(width, height, true);
    }

    function bindResize() {
      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', () => {
        window.setTimeout(handleResize, 320);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', handleResize);
      }
    }

    /* ================================================================== */
    /*  Orientation lock (best effort, requires user gesture)             */
    /* ================================================================== */
    function tryLockLandscape() {
      const orientation = window.screen && window.screen.orientation;
      if (orientation && typeof orientation.lock === 'function') {
        orientation.lock('landscape').catch(() => { /* unsupported / denied */ });
      }
    }

    /* ================================================================== */
    /*  Vertical motion (jump physics applied via groundY)                */
    /* ================================================================== */
    function updateVerticalMotion(dt) {
      if (!player) return;

      if (!isAirborne) {
        // Guarantee the player is grounded when not jumping.
        if (player.config.groundY !== 0) player.config.groundY = 0;
        return;
      }

      jumpVelocity += GRAVITY * dt;
      jumpHeight += jumpVelocity * dt;

      if (jumpHeight <= 0) {
        jumpHeight = 0;
        jumpVelocity = 0;
        isAirborne = false;
      }

      // The Player module locks position.y to config.groundY each frame,
      // so driving groundY is the cleanest way to lift the character.
      player.config.groundY = jumpHeight;
    }

    /* ================================================================== */
    /*  Crouch visual (smooth squash of the loaded model)                 */
    /* ================================================================== */
    function updateCrouchVisual(dt) {
      if (!player || !player.model) return;

      const target = isCrouched ? CROUCH_SCALE : 1.0;
      const k = 1 - Math.exp(-CROUCH_LAMBDA * dt);
      modelScaleY += (target - modelScaleY) * k;

      if (Math.abs(modelScaleY - target) < 0.0005) modelScaleY = target;
      player.model.scale.y = modelScaleY;
    }

    /* ================================================================== */
    /*  TPS camera update                                                 */
    /* ================================================================== */
    function updateCamera(dt) {
      if (!player || !player.ready) return;

      playerPos.copy(player.getPosition());

      cameraTarget.set(
        playerPos.x,
        playerPos.y + CAM_TARGET_HEIGHT,
        playerPos.z
      );

      const cosPitch = Math.cos(camPitch);
      const sinPitch = Math.sin(camPitch);

      desiredCamPos.set(
        cameraTarget.x + Math.sin(camYaw) * cosPitch * CAM_DISTANCE,
        cameraTarget.y + sinPitch * CAM_DISTANCE,
        cameraTarget.z + Math.cos(camYaw) * cosPitch * CAM_DISTANCE
      );

      // Never let the camera dip below the battlefield floor.
      if (desiredCamPos.y < 0.45) desiredCamPos.y = 0.45;

      const k = 1 - Math.exp(-CAM_SMOOTHING * dt);
      smoothCamPos.lerp(desiredCamPos, k);
      camera.position.copy(smoothCamPos);
      camera.lookAt(cameraTarget);
    }

    /* ================================================================== */
    /*  Sun follows the player (keeps the shadow map crisp)               */
    /* ================================================================== */
    function updateSun() {
      if (!sun || !player || !player.ready) return;

      playerPos.copy(player.getPosition());

      sun.target.position.set(playerPos.x, 0, playerPos.z);
      sun.position.set(
        playerPos.x + sunOffset.x,
        sunOffset.y,
        playerPos.z + sunOffset.z
      );

      sun.target.updateMatrixWorld();
      sun.updateMatrixWorld();
    }

    /* ================================================================== */
    /*  HUD stats                                                         */
    /* ================================================================== */
    function updateStats(dt) {
      statTimer += dt;
      frameCounter += 1;

      if (statTimer < 0.4) return;

      measuredFps = frameCounter / statTimer;
      statTimer = 0;
      frameCounter = 0;

      statFpsEl.textContent = measuredFps.toFixed(0);
      statSpeedEl.textContent = player ? player.getSpeed().toFixed(1) : '0.0';

      let stateLabel = 'IDLE';
      if (isAirborne) stateLabel = 'AIR';
      else if (isCrouched) stateLabel = 'CROUCH';
      else if (isSprinting) stateLabel = 'SPRINT';
      else if (player && player.getSpeed() > 0.2) stateLabel = 'WALK';

      statStateEl.textContent = stateLabel;
      sprintBadgeEl.classList.toggle('on', isSprinting);
    }

    /* ================================================================== */
    /*  Main loop                                                         */
    /* ================================================================== */
    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);

      if (player && player.ready) {
        // Determine sprint from joystick deflection (full push = sprint).
        const inputMagnitude = Math.hypot(joystickVector.x, joystickVector.y);
        isSprinting = !isCrouched && inputMagnitude >= SPRINT_THRESHOLD;

        updateVerticalMotion(dt);
        updateCrouchVisual(dt);

        player.update(dt, joystickVector, isSprinting);

        updateSun();
        updateCamera(dt);
        updateStats(dt);
      }

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    /* ================================================================== */
    /*  Boot sequence                                                     */
    /* ================================================================== */
    async function boot() {
      startFakeProgress();

      /* --- Renderer ---------------------------------------------------- */
      renderer = createRenderer();

      /* --- Scene ------------------------------------------------------- */
      scene = createScene();

      /* --- Lighting ---------------------------------------------------- */
      createLighting(scene);

      /* --- Ground ------------------------------------------------------ */
      createGround(scene);

      /* --- Camera ------------------------------------------------------ */
      camera = new THREE.PerspectiveCamera(
        62,
        window.innerWidth / window.innerHeight,
        0.1,
        500
      );
      camera.position.set(0, 3.2, -6.2);

      smoothCamPos.copy(camera.position);
      camera.lookAt(0, CAM_TARGET_HEIGHT, 0);

      /* --- Player ------------------------------------------------------ */
      player = new Player({
        modelUrl:
          'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Soldier.glb',
        modelFallbackUrl:
          'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/Soldier.glb',
        shadow: true,
      });

      loaderTextEl.textContent = 'Loading 3D Character…';

      try {
        await player.init(scene);
      } catch (error) {
        console.error('[index] Player initialisation failed:', error);
        failLoading(
          'Failed to load the 3D character model. Check your network connection and reload.'
        );
        return;
      }

      /* --- Post-init wiring -------------------------------------------- */
      player.setCamera(camera);

      baseWalkSpeed = player.config.walkSpeed;
      baseRunSpeed = player.config.runSpeed;

      // Start the camera directly behind the character.
      camYaw = player.getMesh().rotation.y + Math.PI;
      camPitch = CAM_START_PITCH;

      smoothCamPos.set(
        Math.sin(camYaw) * Math.cos(camPitch) * CAM_DISTANCE,
        CAM_TARGET_HEIGHT + Math.sin(camPitch) * CAM_DISTANCE,
        Math.cos(camYaw) * Math.cos(camPitch) * CAM_DISTANCE
      );

      /* --- Input bindings ---------------------------------------------- */
      bindJoystick();
      bindLookZone();
      bindActions();
      bindResize();

      /* --- Orientation lock (needs a gesture on most browsers) --------- */
      window.addEventListener(
        'pointerdown',
        () => { tryLockLandscape(); },
        { once: true }
      );
      window.addEventListener(
        'touchstart',
        () => { tryLockLandscape(); },
        { once: true }
      );

      /* --- Go ----------------------------------------------------------- */
      handleResize();
      finishLoading();

      clock.start();
      requestAnimationFrame(animate);
    }

    /* ================================================================== */
    /*  Kick off                                                          */
    /* ================================================================== */
    boot().catch((error) => {
      console.error('[index] Fatal boot error:', error);
      failLoading(error && error.message ? error.message : 'Unknown fatal error.');
    });

    /* ================================================================== */
    /*  Pause the clock when the tab is hidden (avoids a huge dt spike)   */
    /* ================================================================== */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clock.stop();
        joystickReset();
      } else {
        clock.start();
        handleResize();
      }
    });
  </script>

</body>
</html>
