<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>WebGL Shooter — Player + Weapons</title>

<style>
  :root{
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --accent: #7CFFB2;
    --glass: rgba(255,255,255,.10);
    --glass-strong: rgba(255,255,255,.20);
    --line: rgba(255,255,255,.38);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%;
    overflow:hidden;
    background:#05070c;
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    touch-action:none;
  }

  #game{
    position:fixed; inset:0;
    width:100%; height:100%;
    display:block;
    touch-action:none;
    background:#05070c;
  }

  /* ================= HUD LAYER ================= */
  #hud{
    position:fixed; inset:0;
    pointer-events:none;      /* everything passes through to canvas by default */
    z-index:10;
  }
  .ctl{ pointer-events:auto; touch-action:none; }

  /* ---------- CROSSHAIR ---------- */
  #crosshair{
    position:absolute;
    left:50%; top:50%;
    width:0; height:0;
    --spread: 6px;
    opacity:1;
    transition:opacity .15s linear;
  }
  #crosshair.ads{ opacity:.30; }

  .ch{
    position:absolute;
    background:var(--accent);
    box-shadow:0 0 4px rgba(0,0,0,.95), 0 0 1px rgba(0,0,0,1);
    border-radius:1px;
  }
  .ch.top   { left:-1px;  bottom:var(--spread); width:2px;  height:9px; }
  .ch.bottom{ left:-1px;  top:var(--spread);    width:2px;  height:9px; }
  .ch.left  { top:-1px;   right:var(--spread);  width:9px;  height:2px; }
  .ch.right { top:-1px;   left:var(--spread);   width:9px;  height:2px; }
  .ch.dot   { left:-1.5px; top:-1.5px; width:3px; height:3px; border-radius:50%; opacity:.9; }

  /* ---------- TOP-RIGHT AMMO HUD ---------- */
  #ammoHud{
    position:absolute;
    top:calc(10px + var(--safe-t));
    right:calc(14px + var(--safe-r));
    text-align:right;
    text-shadow:0 2px 8px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,1);
    line-height:1.05;
  }
  #weaponName{
    font-size:11px; font-weight:700;
    letter-spacing:2.4px;
    text-transform:uppercase;
    opacity:.75;
    margin-bottom:2px;
  }
  #ammoCount{
    font-size:34px; font-weight:800;
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum";
  }
  #ammoCount small{
    font-size:16px; font-weight:600;
    opacity:.62; letter-spacing:0;
  }
  #weaponStatus{
    margin-top:3px;
    font-size:11px; font-weight:700;
    letter-spacing:2px;
    color:var(--accent);
    opacity:.9;
    min-height:14px;
  }
  #weaponStatus.warn{ color:#FFB454; }
  #weaponStatus.bad { color:#FF6B6B; }

  /* ---------- BOTTOM-RIGHT ACTION BUTTONS ---------- */
  #actions{
    position:absolute;
    right:calc(18px + var(--safe-r));
    bottom:calc(22px + var(--safe-b));
    width:200px; height:200px;
    pointer-events:none;
  }

  .btn{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--glass);
    border:2px solid var(--line);
    color:#fff;
    font-weight:800;
    font-size:12px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    text-shadow:0 1px 4px rgba(0,0,0,.9);
    transition:transform .06s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
    pointer-events:auto;
    touch-action:none;
    outline:none;
  }
  .btn.active{ transform:scale(.92); background:var(--glass-strong); border-color:#fff; }
  .btn.on{
    background:rgba(124,255,178,.22);
    border-color:var(--accent);
    box-shadow:0 0 18px rgba(124,255,178,.45), inset 0 0 14px rgba(124,255,178,.20);
    color:var(--accent);
  }

  #btnFire{
    right:0; bottom:0;
    width:100px; height:100px;
    font-size:15px; letter-spacing:2px;
    background:rgba(255,72,72,.18);
    border-color:rgba(255,120,120,.65);
  }
  #btnFire.active{
    background:rgba(255,72,72,.42);
    border-color:#ff8080;
    box-shadow:0 0 26px rgba(255,80,80,.55);
  }

  #btnScope{ right:0;     bottom:110px; width:76px; height:76px; font-size:11px; }
  #btnReload{ right:110px; bottom:4px;  width:76px; height:76px; font-size:11px; }

  /* ---------- JOYSTICK ---------- */
  #joystick{
    position:absolute;
    left:calc(22px + var(--safe-l));
    bottom:calc(26px + var(--safe-b));
    width:140px; height:140px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.10), rgba(255,255,255,.03) 70%, transparent 72%);
    border:2px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
  }
  #joystick.active{ border-color:rgba(255,255,255,.42); }
  #stick{
    position:absolute;
    left:50%; top:50%;
    width:58px; height:58px;
    margin:-29px 0 0 -29px;
    border-radius:50%;
    background:rgba(255,255,255,.22);
    border:2px solid rgba(255,255,255,.55);
    box-shadow:0 2px 12px rgba(0,0,0,.5);
    transition:transform .04s linear;
  }

  /* ---------- JUMP / CROUCH ---------- */
  #btnJump, #btnCrouch{
    width:64px; height:64px;
    font-size:10px;
    left:calc(180px + var(--safe-l));
  }
  #btnJump  { bottom:calc(112px + var(--safe-b)); }
  #btnCrouch{ bottom:calc(36px  + var(--safe-b)); }
  #btnCrouch.on{ background:rgba(124,178,255,.22); border-color:#7CB2FF; color:#7CB2FF; box-shadow:0 0 18px rgba(124,178,255,.4); }

  /* ---------- OVERLAY ---------- */
  #overlay{
    position:fixed; inset:0;
    z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 45%, #101a28 0%, #05070c 70%);
    transition:opacity .5s ease;
    font-size:13px; letter-spacing:3px; text-transform:uppercase;
    color:rgba(255,255,255,.75);
    text-align:center; padding:24px;
  }
  #overlay.hidden{ opacity:0; pointer-events:none; }
  #overlayText{ max-width:80vw; line-height:1.8; }
  #overlayText .spinner{
    display:block; width:26px; height:26px; margin:0 auto 18px;
    border:2px solid rgba(255,255,255,.15);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <!-- Dynamic crosshair -->
  <div id="crosshair">
    <div class="ch top"></div>
    <div class="ch bottom"></div>
    <div class="ch left"></div>
    <div class="ch right"></div>
    <div class="ch dot"></div>
  </div>

  <!-- Top-right ammo counter -->
  <div id="ammoHud">
    <div id="weaponName">Assault Rifle</div>
    <div id="ammoCount">30 <small>/ 120</small></div>
    <div id="weaponStatus">Ready</div>
  </div>

  <!-- Bottom-right actions -->
  <div id="actions">
    <button id="btnReload" class="btn ctl">Reload</button>
    <button id="btnScope"  class="btn ctl">Scope</button>
    <button id="btnFire"   class="btn ctl">Fire</button>
  </div>

  <!-- Left joystick + jump/crouch -->
  <div id="joystick" class="ctl"><div id="stick"></div></div>
  <button id="btnJump"   class="btn ctl">Jump</button>
  <button id="btnCrouch" class="btn ctl">Crouch</button>
</div>

<div id="overlay">
  <div id="overlayText"><span class="spinner"></span>Loading assets…</div>
</div>

<!-- Three.js resolution for the bare "three" specifier used inside your modules -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* ============================================================================
 *  index.html — integration layer
 *  Modules: ./js/player.js  (Player)   ./js/weapons.js (Weapon)
 *
 *  The integration layer is deliberately defensive: it probes for the most
 *  common property / method names so that small API differences in your
 *  modules do not break the build.
 * ==========================================================================*/

import * as THREE from 'three';
import { Player } from './js/player.js';
import { Weapon } from './js/weapons.js';

/* ---------------------------------------------------------------------------
 *  CONFIG — tweak these to match your modules
 * -------------------------------------------------------------------------*/
const CONFIG = {
  /* Set to false if your Player class already rotates the camera itself. */
  handleLook:        true,

  hipFov:            75,
  adsFov:            45,
  adsLerp:           14,

  lookSensitivity:   0.0030,
  adsSensScale:      0.55,
  pitchLimit:        Math.PI / 2 - 0.06,

  baseSpread:        6,      // px, crosshair at rest
  maxSpread:         34,
  bloomPerShot:      9,
  bloomRecovery:     28,

  recoilPitch:       0.011,  // radians kick per shot
  recoilYaw:         0.005,
  recoilRecovery:    9,      // exponential decay rate

  defaultFireRate:   9       // rounds / second fallback
};

/* ---------------------------------------------------------------------------
 *  DOM
 * -------------------------------------------------------------------------*/
const canvas       = document.getElementById('game');
const crosshairEl  = document.getElementById('crosshair');
const ammoCountEl  = document.getElementById('ammoCount');
const weaponNameEl = document.getElementById('weaponName');
const statusEl     = document.getElementById('weaponStatus');
const btnFire      = document.getElementById('btnFire');
const btnScope     = document.getElementById('btnScope');
const btnReload    = document.getElementById('btnReload');
const btnJump      = document.getElementById('btnJump');
const btnCrouch    = document.getElementById('btnCrouch');
const joystickEl   = document.getElementById('joystick');
const stickEl      = document.getElementById('stick');
const overlayEl    = document.getElementById('overlay');
const overlayText  = document.getElementById('overlayText');

/* Surface any hard failure instead of a black screen. */
window.addEventListener('error', (e) => {
  overlayEl.classList.remove('hidden');
  overlayText.innerHTML = 'Runtime error<br><span style="opacity:.6;font-size:11px">' +
    (e.message || 'unknown') + '</span>';
});

/* ---------------------------------------------------------------------------
 *  RENDERER / SCENE / CAMERA
 * -------------------------------------------------------------------------*/
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: (window.devicePixelRatio || 1) < 2,
  powerPreference: 'high-performance',
  stencil: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1520);
scene.fog = new THREE.Fog(0x0d1520, 45, 170);

const camera = new THREE.PerspectiveCamera(
  CONFIG.hipFov,
  window.innerWidth / window.innerHeight,
  0.05,
  600
);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.7, 8);
scene.add(camera);           // required if the weapon ends up camera-mounted

/* ------------------------------- LIGHTS ---------------------------------- */
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x2a2f36, 1.15));

const sun = new THREE.DirectionalLight(0xffe9c4, 1.7);
sun.position.set(20, 34, 14);
scene.add(sun);

const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-16, 12, -20);
scene.add(fill);

/* ------------------------------- WORLD ----------------------------------- */
function makeGroundTexture() {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#2b3138'; g.fillRect(0, 0, S, S);
  g.fillStyle = '#333a42';
  g.fillRect(0, 0, S / 2, S / 2);
  g.fillRect(S / 2, S / 2, S / 2, S / 2);
  g.strokeStyle = 'rgba(255,255,255,.05)';
  g.lineWidth = 2;
  g.strokeRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(70, 70);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;
  return t;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* Some cover / targets to shoot at. */
const crateGeo = new THREE.BoxGeometry(1, 1, 1);
const crateMat = new THREE.MeshStandardMaterial({ color: 0x6b5a45, roughness: 0.92 });

for (let i = 0; i < 16; i++) {
  const m = new THREE.Mesh(crateGeo, crateMat);
  const sx = 0.8 + Math.random() * 0.9;
  const sy = 0.8 + Math.random() * 0.9;
  const sz = 0.8 + Math.random() * 0.9;
  const angle = Math.random() * Math.PI * 2;
  const dist = 9 + Math.random() * 26;
  m.scale.set(sx, sy, sz);
  m.position.set(Math.cos(angle) * dist, sy / 2, Math.sin(angle) * dist - 6);
  m.rotation.y = Math.random() * Math.PI;
  scene.add(m);
}

/* ---------------------------------------------------------------------------
 *  MODULE INSTANTIATION  (defensive — tolerates different ctor signatures)
 * -------------------------------------------------------------------------*/
function tryConstruct(Ctor, attempts, label) {
  for (const args of attempts) {
    try {
      const instance = new Ctor(...args);
      if (instance) return instance;
    } catch (err) {
      console.warn(`[index] new ${label}(...) attempt failed:`, err && err.message);
    }
  }
  console.error(`[index] Could not construct ${label} — continuing without it.`);
  return null;
}

const player = tryConstruct(Player, [
  [scene, camera],
  [{ scene, camera }],
  [scene, camera, renderer]
], 'Player');

const weapon = tryConstruct(Weapon, [
  [scene, camera, player],
  [{ scene, camera, player }],
  [scene, camera],
  [{ scene, camera }]
], 'Weapon');

/* ---------------------------------------------------------------------------
 *  WEAPON → PLAYER HAND ATTACHMENT
 * -------------------------------------------------------------------------*/
let weaponAttached = false;

function resolveHand(p) {
  if (!p) return null;
  const direct = p.hand || p.handMesh || p.rightHand || p.rightHandMesh || p.handBone;
  if (direct && direct.isObject3D) return direct;
  if (typeof p.getHand === 'function') {
    try {
      const h = p.getHand();
      if (h && h.isObject3D) return h;
    } catch (_) { /* ignore */ }
  }
  return null;
}

function resolveWeaponModel(w) {
  if (!w) return null;
  const candidates = [w.model, w.mesh, w.group, w.object3D, w.root, w.gun, w.weaponModel];
  for (const c of candidates) if (c && c.isObject3D) return c;
  return null;
}

/**
 * Called every frame until the weapon model exists and has been parented.
 * Handles the case where weapons.js finishes its GLTF load asynchronously.
 */
function tryAttachWeapon() {
  if (weaponAttached || !weapon) return;

  const model = resolveWeaponModel(weapon);
  if (!model) return;                        // still loading

  /* 1) Preferred: the Weapon module exposes its own mounting API. */
  const hand = resolveHand(player);

  if (typeof weapon.attachTo === 'function') {
    try { weapon.attachTo(hand || camera); weaponAttached = true; return; }
    catch (e) { console.warn('[index] weapon.attachTo failed', e); }
  }
  if (typeof weapon.equip === 'function') {
    try { weapon.equip(hand || player || camera); weaponAttached = true; return; }
    catch (e) { console.warn('[index] weapon.equip failed', e); }
  }

  /* 2) Fallback: manually reparent the model. */
  if (hand) {
    hand.add(model);
    weaponAttached = true;
    console.log('[index] Weapon attached to player hand.');
  } else {
    // Camera-mounted view-model (classic FPS fallback).
    if (model.parent) model.parent.remove(model);
    model.position.set(0.24, -0.22, -0.55);
    model.rotation.set(0, Math.PI, 0);
    camera.add(model);
    weaponAttached = true;
    console.log('[index] Weapon attached to camera (no hand mesh found).');
  }
}

/* ---------------------------------------------------------------------------
 *  PLAYER ADAPTER — push movement / jump / crouch into whatever API exists
 * -------------------------------------------------------------------------*/
function pushMoveInput(x, y) {
  if (!player) return;
  if (typeof player.setMoveInput === 'function') { player.setMoveInput(x, y); return; }
  if (player.moveInput && typeof player.moveInput.set === 'function') { player.moveInput.set(x, y); return; }
  if (player.input && typeof player.input === 'object') { player.input.x = x; player.input.y = y; }
  player.moveX = x;
  player.moveY = y;
}

function doJump() {
  if (!player) return;
  if (typeof player.jump === 'function') { player.jump(); return; }
  if (typeof player.onJump === 'function') { player.onJump(); return; }
  player.wantsJump = true;
}

let crouching = false;
function setCrouch(v) {
  crouching = v;
  btnCrouch.classList.toggle('on', crouching);
  if (!player) return;
  if (typeof player.setCrouch === 'function') { player.setCrouch(crouching); return; }
  if (typeof player.crouch === 'function') { player.crouch(crouching); return; }
  player.isCrouching = crouching;
  player.crouching = crouching;
}

/* ---------------------------------------------------------------------------
 *  LOOK / RECOIL STATE
 * -------------------------------------------------------------------------*/
const look = { yaw: 0, pitch: -0.04 };
const kick = { yaw: 0, pitch: 0 };
let bloom = 0;
let ads = false;

const moveVec = { x: 0, y: 0 };    // from joystick  (y positive = forward)
const keys = new Set();

let lookPointerId = null;
const lastPointer = { x: 0, y: 0 };

function applyLookDelta(dx, dy) {
  const sens = CONFIG.lookSensitivity * (ads ? CONFIG.adsSensScale : 1);
  look.yaw   -= dx * sens;
  look.pitch -= dy * sens;
  look.pitch = Math.max(-CONFIG.pitchLimit, Math.min(CONFIG.pitchLimit, look.pitch));
}

/* ---------------------------------------------------------------------------
 *  INPUT — touch look (canvas), pointer lock (desktop), keyboard
 * -------------------------------------------------------------------------*/
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse') {
    if (document.pointerLockElement !== canvas) {
      if (canvas.requestPointerLock) canvas.requestPointerLock();
      return;
    }
    fireHeldMouse = true;
    return;
  }
  if (lookPointerId === null) {
    lookPointerId = e.pointerId;
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') {
    if (document.pointerLockElement === canvas) {
      applyLookDelta(e.movementX || 0, e.movementY || 0);
    }
    return;
  }
  if (e.pointerId !== lookPointerId) return;
  applyLookDelta(e.clientX - lastPointer.x, e.clientY - lastPointer.y);
  lastPointer.x = e.clientX;
  lastPointer.y = e.clientY;
});

function endLook(e) {
  if (e.pointerId === lookPointerId) lookPointerId = null;
}
canvas.addEventListener('pointerup', endLook);
canvas.addEventListener('pointercancel', endLook);
canvas.addEventListener('lostpointercapture', endLook);

/* Desktop mouse fire */
let fireHeldMouse = false;
document.addEventListener('mousedown', (e) => {
  if (e.button === 0 && document.pointerLockElement === canvas) fireHeldMouse = true;
});
document.addEventListener('mouseup', (e) => {
  if (e.button === 0) fireHeldMouse = false;
});

/* Keyboard (desktop testing) */
window.addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (e.code === 'Space') { doJump(); e.preventDefault(); }
  if (e.code === 'KeyR') doReload();
  if (e.code === 'KeyC') setCrouch(!crouching);
  if (e.code === 'KeyF') setADS(!ads);
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); fireHeldMouse = false; fireHeldButton = false; });

/* ---------------------------------------------------------------------------
 *  BUTTON BINDING HELPERS
 * -------------------------------------------------------------------------*/
function bindHold(el, onDown, onUp) {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    el.classList.add('active');
    if (onDown) onDown();
  });
  const up = (e) => {
    if (e) e.stopPropagation();
    el.classList.remove('active');
    if (onUp) onUp();
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

function bindTap(el, fn) {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    el.classList.add('active');
    fn();
  });
  const up = (e) => { if (e) e.stopPropagation(); el.classList.remove('active'); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* FIRE ------------------------------------------------------------------- */
let fireHeldButton = false;
bindHold(
  btnFire,
  () => { fireHeldButton = true; },
  () => { fireHeldButton = false; }
);

/* SCOPE / ADS ------------------------------------------------------------ */
bindTap(btnScope, () => setADS(!ads));

/* RELOAD ----------------------------------------------------------------- */
bindTap(btnReload, doReload);

/* JUMP ------------------------------------------------------------------- */
bindTap(btnJump, doJump);

/* CROUCH ----------------------------------------------------------------- */
bindTap(btnCrouch, () => setCrouch(!crouching));

/* ---------------------------------------------------------------------------
 *  JOYSTICK
 * -------------------------------------------------------------------------*/
let joyPointerId = null;

function joyMove(e) {
  const r = joystickEl.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const radius = r.width / 2;

  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const len = Math.hypot(dx, dy) || 1;
  const clamped = Math.min(len, radius);
  dx = (dx / len) * clamped;
  dy = (dy / len) * clamped;

  stickEl.style.transform = `translate(${dx}px, ${dy}px)`;

  moveVec.x = dx / radius;
  moveVec.y = -dy / radius;      // screen-up == forward
}

joystickEl.addEventListener('pointerdown', (e) => {
  if (joyPointerId !== null) return;
  joyPointerId = e.pointerId;
  try { joystickEl.setPointerCapture(e.pointerId); } catch (_) {}
  joystickEl.classList.add('active');
  joyMove(e);
  e.preventDefault();
  e.stopPropagation();
});

joystickEl.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyPointerId) return;
  joyMove(e);
  e.preventDefault();
  e.stopPropagation();
});

function joyEnd(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  moveVec.x = moveVec.y = 0;
  stickEl.style.transform = 'translate(0px, 0px)';
  joystickEl.classList.remove('active');
}
joystickEl.addEventListener('pointerup', joyEnd);
joystickEl.addEventListener('pointercancel', joyEnd);
joystickEl.addEventListener('lostpointercapture', joyEnd);

/* ---------------------------------------------------------------------------
 *  ADS
 * -------------------------------------------------------------------------*/
function setADS(v) {
  if (ads === v) return;
  ads = v;
  btnScope.classList.toggle('on', ads);
  crosshairEl.classList.toggle('ads', ads);

  if (!weapon) return;
  if (typeof weapon.setADS === 'function')        weapon.setADS(ads);
  else if (typeof weapon.setAiming === 'function') weapon.setAiming(ads);
  else if (typeof weapon.aim === 'function')       weapon.aim(ads);
  else weapon.isAiming = ads;
}

/* ---------------------------------------------------------------------------
 *  FIRE / RELOAD
 * -------------------------------------------------------------------------*/
let lastShotAt = -Infinity;

function currentFireInterval() {
  if (!weapon) return 1 / CONFIG.defaultFireRate;
  const rate =
    weapon.fireRate ||
    weapon.rps ||
    weapon.roundsPerSecond ||
    weapon.shotsPerSecond ||
    weapon.rpm / 60 ||
    CONFIG.defaultFireRate;
  return 1 / Math.max(0.5, Number(rate) || CONFIG.defaultFireRate);
}

function isFiring() {
  return fireHeldButton || fireHeldMouse || keys.has('KeyF') === false && keys.has('Space') === false
    ? (fireHeldButton || fireHeldMouse)
    : (fireHeldButton || fireHeldMouse);
}

function addRecoil() {
  kick.pitch += CONFIG.recoilPitch * (0.7 + Math.random() * 0.6);
  kick.yaw   += (Math.random() - 0.5) * 2 * CONFIG.recoilYaw;
  bloom = Math.min(CONFIG.maxSpread, bloom + CONFIG.bloomPerShot);
}

function tryFire() {
  if (!weapon || typeof weapon.shoot !== 'function') return;

  const now = performance.now() / 1000;
  if (now - lastShotAt < currentFireInterval()) return;
  lastShotAt = now;

  let result;
  try {
    result = weapon.shoot(scene, camera);
  } catch (err) {
    console.error('[index] weapon.shoot() threw:', err);
    return;
  }

  // Weapon returns false when it cannot fire (empty mag / mid-reload / cooldown)
  if (result === false) return;

  addRecoil();
}

let transientStatus = '';
let transientUntil = 0;
function flashStatus(text, ms = 900) {
  transientStatus = text;
  transientUntil = performance.now() + ms;
}

function doReload() {
  if (!weapon) return;

  const reloading = weapon.isReloading || weapon.reloading;
  if (reloading) return;

  if (typeof weapon.reload === 'function')           weapon.reload();
  else if (typeof weapon.startReload === 'function') weapon.startReload();
  else if (typeof weapon.reloadWeapon === 'function') weapon.reloadWeapon();
  else return;

  flashStatus('RELOADING…', 1200);
}

/* ---------------------------------------------------------------------------
 *  HUD READING HELPERS
 * -------------------------------------------------------------------------*/
const asNum = (v) => (typeof v === 'number' && Number.isFinite(v)) ? v : null;

function readAmmo(w) {
  if (!w) return { mag: 30, reserve: 120 };

  const mag =
    asNum(w.ammoInMag)   ?? asNum(w.currentAmmo) ?? asNum(w.magAmmo) ??
    asNum(w.ammoInClip)  ?? asNum(w.clip)        ?? asNum(w.ammo)    ?? 30;

  const reserve =
    asNum(w.reserveAmmo) ?? asNum(w.reserve)     ?? asNum(w.spareAmmo) ??
    asNum(w.totalAmmo)   ?? asNum(w.ammoReserve) ?? 120;

  return { mag, reserve };
}

let lastAmmoKey = '';
let lastNameKey = '';

function updateHUD() {
  /* --- ammo --- */
  const { mag, reserve } = readAmmo(weapon);
  const ammoKey = mag + '|' + reserve;
  if (ammoKey !== lastAmmoKey) {
    lastAmmoKey = ammoKey;
    ammoCountEl.innerHTML = `${mag} <small>/ ${reserve}</small>`;
  }

  /* --- weapon name --- */
  const name = (weapon && (weapon.name || weapon.weaponName || weapon.label)) || 'Assault Rifle';
  if (name !== lastNameKey) {
    lastNameKey = name;
    weaponNameEl.textContent = name;
  }

  /* --- status --- */
  let status, cls = '';
  const reloading = weapon && (weapon.isReloading || weapon.reloading);

  if (performance.now() < transientUntil) {
    status = transientStatus;
    cls = 'warn';
  } else if (reloading) {
    status = 'RELOADING…';
    cls = 'warn';
  } else if (mag <= 0) {
    status = reserve > 0 ? 'PRESS RELOAD' : 'NO AMMO';
    cls = 'bad';
  } else if (ads) {
    status = 'ADS';
  } else {
    status = 'READY';
  }

  if (statusEl.textContent !== status) statusEl.textContent = status;
  if (statusEl.className !== cls) statusEl.className = cls;
}

/* ---------------------------------------------------------------------------
 *  PER-FRAME UPDATES
 * -------------------------------------------------------------------------*/
function updateInput() {
  let kx = 0, ky = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    ky += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  ky -= 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  kx -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) kx += 1;

  const x = Math.max(-1, Math.min(1, moveVec.x + kx));
  const y = Math.max(-1, Math.min(1, moveVec.y + ky));
  pushMoveInput(x, y);
}

function updatePlayer(dt) {
  if (!player) return;
  if (typeof player.setLook === 'function') player.setLook(look.yaw, look.pitch);
  if (typeof player.update === 'function')  player.update(dt, camera);
}

function updateWeapon(dt) {
  if (!weapon) return;
  if (typeof weapon.update === 'function') weapon.update(dt, camera, scene);
  tryAttachWeapon();
}

function updateRecoil(dt) {
  const k = Math.exp(-CONFIG.recoilRecovery * dt);
  kick.pitch *= k;
  kick.yaw   *= k;
}

function applyLook() {
  if (!CONFIG.handleLook) return;
  camera.rotation.set(
    look.pitch + kick.pitch,
    look.yaw   + kick.yaw,
    0,
    'YXZ'
  );
}

function updateAds(dt) {
  const target = ads ? CONFIG.adsFov : CONFIG.hipFov;
  if (Math.abs(camera.fov - target) > 0.01) {
    camera.fov += (target - camera.fov) * Math.min(1, dt * CONFIG.adsLerp);
    camera.updateProjectionMatrix();
  }
}

function updateCrosshair(dt) {
  bloom = Math.max(0, bloom - CONFIG.bloomRecovery * dt);
  const spread = CONFIG.baseSpread + bloom;
  crosshairEl.style.setProperty('--spread', spread.toFixed(1) + 'px');
}

/* ---------------------------------------------------------------------------
 *  MAIN LOOP
 * -------------------------------------------------------------------------*/
const clock = new THREE.Clock();
let framesRendered = 0;
let overlayHidden = false;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  updateInput();
  updatePlayer(dt);
  updateWeapon(dt);

  if (isFiring()) tryFire();

  updateRecoil(dt);
  applyLook();
  updateAds(dt);
  updateCrosshair(dt);
  updateHUD();

  renderer.render(scene, camera);

  framesRendered++;
  if (!overlayHidden && framesRendered > 3) {
    overlayHidden = true;
    overlayEl.classList.add('hidden');
    setTimeout(() => { if (overlayHidden) overlayEl.style.display = 'none'; }, 600);
  }
}

/* ---------------------------------------------------------------------------
 *  RESIZE
 * -------------------------------------------------------------------------*/
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

/* iOS: block pinch-zoom / double-tap zoom gestures over the HUD */
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

/* ---------------------------------------------------------------------------
 *  GO
 * -------------------------------------------------------------------------*/
console.log('[index] Player:', player, '| Weapon:', weapon);
animate();
</script>
</body>
</html>
